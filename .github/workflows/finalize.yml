name: Finalize verified source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[finalize] verify event-face-finder source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore source archive when transfer chunks exist
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.bootstrap/part-*' > /dev/null; then
            cat .bootstrap/part-* > /tmp/event-face-finder.tar.gz.b64
            base64 --decode /tmp/event-face-finder.tar.gz.b64 > /tmp/event-face-finder.tar.gz
            echo '6fdb7b904398fcf6e8b16756e9e17d6a2417b6d26dea017970a111082a4f386f  /tmp/event-face-finder.tar.gz' | sha256sum --check --strict
            tar -xzf /tmp/event-face-finder.tar.gz -C .
          fi
          test -f pyproject.toml
          test -f app/main.py
          test -d tests

      - name: Remove one-time transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/finalize.yml

      - name: Install and test the restored tree
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run python -m compileall -q app tests
          uv run pytest -q

      - name: Commit the verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already matches the verified source tree.'
            exit 0
          fi
          git commit -m 'feat: finalize verified consent-based photo matching MVP'
          git push origin HEAD:main
