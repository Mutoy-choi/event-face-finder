name: Bootstrap source

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[bootstrap] restore verified source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/event-face-finder.tar.gz.b64
          base64 --decode /tmp/event-face-finder.tar.gz.b64 > /tmp/event-face-finder.tar.gz
          echo "6fdb7b904398fcf6e8b16756e9e17d6a2417b6d26dea017970a111082a4f386f  /tmp/event-face-finder.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/event-face-finder.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Verified source is already restored."
            exit 0
          fi
          git commit -m "feat: launch consent-based event selfie search MVP"
          git push origin HEAD:main
