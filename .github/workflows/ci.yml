name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            space/requirements.txt
            space/requirements-dev.txt
      - name: Install
        working-directory: space
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q space
      - name: Lint
        run: ruff check space
      - name: Test
        working-directory: space
        run: pytest -q

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Space image and download verified models
        run: docker build -t event-face-finder-space ./space
